<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArtBridge · 서명과 계약 잠금 데모</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f1;color:#24324b;font:16px/1.65 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:34px 24px}header,.row{display:flex;justify-content:space-between;gap:18px;align-items:center}small{letter-spacing:.13em}h1{font:48px/1.2 Georgia,serif;margin:25px 0 10px}h2{font-size:21px}button,select,input,textarea{font:inherit;color:inherit;border:1px solid #b9bec8;border-radius:5px;padding:11px;background:white}button{cursor:pointer}button.primary{background:#24324b;color:white;border-color:#24324b}button:disabled{opacity:.45;cursor:default}section{background:#fff;border:1px solid #d6d9df;border-radius:8px;padding:24px;margin:20px 0}.notice{padding:14px 18px;background:#e6e8eb;border-left:3px solid #974d38}.steps,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.steps div{padding:12px;background:#e9ebef;border-radius:5px}.steps .active{background:#24324b;color:white}.badge{padding:5px 12px;border-radius:24px;background:#e8eaf0;white-space:nowrap}label{display:block;margin:14px 0 6px;font-size:14px}input,textarea{width:100%}textarea{min-height:145px}input:disabled,textarea:disabled{background:#f0f1f3;opacity:1}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:18px}.signature{padding:18px;background:#f4f4f3;border-radius:6px}.signed{color:#21634c;font-weight:700}.muted{color:#677185;font-size:14px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}#history{padding-left:22px}#history li{margin:8px 0}.toast{min-height:26px;color:#21634c;font-weight:600}@media(max-width:720px){.grid,.steps,.signatures{grid-template-columns:1fr}header,.row{align-items:flex-start;flex-wrap:wrap}h1{font-size:36px}}
</style><main><header><small>ARTBRIDGE / STUDIO</small><div><select id="lang" aria-label="언어"><option value="ko">한국어</option><option value="en">English</option><option value="sw">Kiswahili</option></select> <button id="reset"></button></div></header><h1 id="title"></h1><p>Maya Chen × Dr. Bulugu</p><p class="notice" id="demo"></p><div class="steps" id="steps"></div><section><div class="row"><h2 id="contractTitle"></h2><span class="badge" id="state"></span></div><p id="help"></p><div class="grid" id="fields"></div><div class="actions"><button id="save"></button><button class="primary" id="request"></button><button id="amend"></button></div><p class="toast" id="message" role="status" aria-live="polite"></p><div class="signatures" id="signatures"></div></section><section><div class="row"><h2 id="progressTitle"></h2><select id="progress"></select></div><p class="muted" id="progressHelp"></p></section><section><h2 id="historyTitle"></h2><ol id="history"></ol></section></main><script>
const copy={ko:{title:'여인과 여인',reset:'처음부터 시연',demo:'서명 흐름 데모 · 이 파일의 버튼은 서명 과정을 보여주기 위한 것입니다. 실제 서명이나 상대방 초대는 이루어지지 않습니다.',steps:['1. 조건 협의','2. 두 화가 서명','3. 계약 원본 잠금'],contract:'계약 내용',states:['초안 · 수정 가능','서명 대기 · 내용 고정','서명 완료 · 원본 잠금'],help:['세 언어의 내용을 확인하고 서명을 요청해 보세요.','이 버전은 고정되었습니다. 두 화가의 서명을 각각 시연해 보세요.','두 사람의 서명이 완료되었습니다. 원본은 수정할 수 있으며가 아니라, 읽기만 가능합니다. 변경은 새 합의서에서 진행합니다.'],field:['프로젝트 설명','결과물','크레딧','사용 허락','Maya 수익 배분 (%)'],save:'초안 저장',request:'서명 요청 시연',amend:'변경합의서 만들기',sign:'서명 시연',signed:'서명 완료',waiting:'서명 대기',version:'버전',progress:'작업 진행 상태',progressHelp:'계약에 서명한 뒤에도 작업 상태는 변경할 수 있습니다. 계약 원본에는 영향을 주지 않습니다.',stages:['기획 중','제작 중','검토 중','완료'],history:'계약 기록',created:'초안을 만들었습니다.',saved:'초안을 저장했습니다.',requested:'이 버전의 세 언어 내용을 고정하고 서명을 요청했습니다.',locked:'두 사람의 서명이 완료되어 계약 원본을 잠갔습니다.',amended:'이전 원본을 보관하고 새 변경합의서를 만들었습니다.',archive:'보관된 서명 원본',view:'원본 보기',close:'닫기',invalid:'수익 배분은 0부터 100 사이로 입력해 주세요.'},en:{title:'Woman to Woman',reset:'Reset demo',demo:'Signature flow demo · Buttons simulate signing only. No real signature or invitation is created.',steps:['1. Discuss terms','2. Both artists sign','3. Lock agreement'],contract:'Agreement',states:['Draft · editable','Awaiting signatures · fixed','Signed · original locked'],help:['Review all three languages, then request signatures.','This version is fixed. Simulate each artist signing.','Both artists have signed. The original is read-only. Changes require a new amendment.'],field:['Project brief','Deliverables','Credit','Permission','Maya revenue share (%)'],save:'Save draft',request:'Simulate signature request',amend:'Create amendment',sign:'Simulate signature',signed:'Signed',waiting:'Awaiting signature',version:'Version',progress:'Project stage',progressHelp:'Progress can change after signing without changing the agreement.',stages:['Planning','Creating','In review','Completed'],history:'Agreement history',created:'Draft created.',saved:'Draft saved.',requested:'The three-language version was fixed and signatures requested.',locked:'Both signatures completed. Original agreement locked.',amended:'Previous version preserved. New amendment created.',archive:'Archived signed original',view:'View original',close:'Close',invalid:'Enter a revenue share between 0 and 100.'},sw:{title:'Mwanamke kwa Mwanamke',reset:'Anza upya',demo:'Onyesho la kusaini · Vitufe vinaiga kusaini tu. Hakuna sahihi halisi wala mwaliko unaotumwa.',steps:['1. Jadili masharti','2. Wasanii wote wasaini','3. Funga makubaliano'],contract:'Makubaliano',states:['Rasimu · inaweza kuhaririwa','Inasubiri sahihi · imewekwa','Imesainiwa · imefungwa'],help:['Kagua lugha zote tatu, kisha omba sahihi.','Toleo hili limewekwa. Jaribu sahihi ya kila msanii.','Wasanii wote wamesaini. Asili inasomwa tu. Mabadiliko yanahitaji makubaliano mapya.'],field:['Maelezo ya mradi','Matokeo','Majina ya wasanii','Ruhusa','Sehemu ya mapato ya Maya (%)'],save:'Hifadhi rasimu',request:'Iga ombi la sahihi',amend:'Unda marekebisho',sign:'Iga kusaini',signed:'Imesainiwa',waiting:'Inasubiri sahihi',version:'Toleo',progress:'Hatua ya mradi',progressHelp:'Hatua ya kazi inaweza kubadilishwa baada ya kusaini bila kubadili makubaliano.',stages:['Mipango','Uundaji','Ukaguzi','Imekamilika'],history:'Historia ya makubaliano',created:'Rasimu imeundwa.',saved:'Rasimu imehifadhiwa.',requested:'Toleo la lugha tatu limewekwa na sahihi zimeombwa.',locked:'Wasanii wote wamesaini. Asili imefungwa.',amended:'Asili imehifadhiwa. Marekebisho mapya yameundwa.',archive:'Asili iliyosainiwa',view:'Tazama asili',close:'Funga',invalid:'Weka asilimia kati ya 0 na 100.'}};
copy.ko.help[2]='두 사람의 서명이 완료되었습니다. 원본은 읽기만 가능합니다. 변경은 새 합의서에서 진행합니다.';
const initial={ko:['탄자니아와 LA의 여인을 그린 두 작품을 하나의 선으로 연결합니다.','공동 작품 1점과 디지털 이미지','Maya Chen × Dr. Bulugu','합의한 전시용으로만 사용. 상품 제작은 별도 합의.'],en:['Connect two paintings of women in Tanzania and LA with a single line.','One collaborative artwork and a digital image','Maya Chen × Dr. Bulugu','For the agreed exhibition only. Merchandise requires a separate agreement.'],sw:['Unganisha picha mbili za wanawake wa Tanzania na LA kwa mstari mmoja.','Kazi moja ya pamoja na picha ya kidijitali','Maya Chen × Dr. Bulugu','Kwa maonyesho yaliyokubaliwa tu. Bidhaa zinahitaji makubaliano tofauti.']};
let lang='ko',version=1,phase=0,signed=[null,null],share=50,data,logs,archives,stage=0;
const $=id=>document.getElementById(id);function event(key,name=''){logs.push({key,name,time:new Date().toLocaleTimeString()})}function reset(){version=1;phase=0;signed=[null,null];share=50;data=structuredClone(initial);logs=[];archives=[];stage=0;event('created');render()}
function capture(){if(phase)return;document.querySelectorAll('[data-l]').forEach(e=>data[e.dataset.l][+e.dataset.i]=e.value);share=+$('share').value}
function el(tag,text){let e=document.createElement(tag);e.textContent=text;return e}
function render(){let t=copy[lang];document.documentElement.lang=lang;['title','reset','demo'].forEach(k=>$(k).textContent=t[k]);$('contractTitle').textContent=t.contract+' · '+t.version+' '+version;$('state').textContent=t.states[phase];$('help').textContent=t.help[phase];$('steps').replaceChildren(...t.steps.map((s,i)=>{let e=el('div',s);e.className=i===phase?'active':'';return e}));$('fields').replaceChildren();for(let [l,name] of [['en','English'],['ko','한국어'],['sw','Kiswahili']]){let c=el('div','');c.append(el('h2',name));data[l].forEach((value,i)=>{c.append(el('label',copy[l].field[i]));let a=document.createElement('textarea');a.value=value;a.dataset.l=l;a.dataset.i=i;a.disabled=phase>0;a.setAttribute('aria-label',name+' '+copy[l].field[i]);c.append(a)});$('fields').append(c)}let box=el('div','');box.append(el('label',t.field[4]));let input=document.createElement('input');Object.assign(input,{id:'share',type:'number',min:'0',max:'100',value:share,disabled:phase>0});box.append(input,el('p',`Dr. Bulugu: ${100-share}%`));$('fields').append(box);for(let id of ['save','request','amend'])$(id).textContent=t[id];$('save').hidden=phase>0;$('request').hidden=phase>0;$('amend').hidden=phase!==2;$('signatures').replaceChildren();if(phase>0)['Maya Chen','Dr. Bulugu'].forEach((name,i)=>{let c=el('div','');c.className='signature';c.append(el('h2',name));let s=el('p',signed[i]?t.signed+' · '+signed[i]:t.waiting);s.className=signed[i]?'signed':'';c.append(s);if(!signed[i]){let b=el('button',name+' · '+t.sign);b.onclick=()=>{signed[i]=new Date().toLocaleString();event('signed',name);if(signed.every(Boolean)){phase=2;event('locked')}render()};c.append(b)}$('signatures').append(c)});$('progressTitle').textContent=t.progress;$('progressHelp').textContent=t.progressHelp;$('progress').replaceChildren(...t.stages.map((v,i)=>{let o=el('option',v);o.value=i;return o}));$('progress').value=stage;$('historyTitle').textContent=t.history;$('history').replaceChildren(...logs.map(x=>el('li',x.time+' · '+(x.name?x.name+' · ':'')+t[x.key])));archives.forEach(a=>{let li=el('li',t.archive+' · '+t.version+' '+a.version+' ');let b=el('button',t.view);b.onclick=()=>{let d=document.createElement('dialog');d.style.cssText='max-width:800px;width:90%;border:1px solid #aaa;padding:28px';d.append(el('h2',t.archive+' · '+t.version+' '+a.version));for(let l of ['en','ko','sw']){d.append(el('h3',l));a.data[l].forEach((s,i)=>d.append(el('p',copy[l].field[i]+': '+s)))}d.append(el('p',`Maya: ${a.share}% / Dr. Bulugu: ${100-a.share}%`));a.signed.forEach((s,i)=>d.append(el('p',['Maya Chen','Dr. Bulugu'][i]+' · '+s)));let close=el('button',t.close);close.onclick=()=>d.remove();d.append(close);document.body.append(d);d.showModal()};li.append(b);$('history').append(li)})}
$('lang').onchange=e=>{capture();lang=e.target.value;render()};$('reset').onclick=reset;$('save').onclick=()=>{capture();if(!Number.isFinite(share)||share<0||share>100){$('message').textContent=copy[lang].invalid;return}event('saved');render();$('message').textContent=copy[lang].saved};$('request').onclick=()=>{capture();if(!Number.isFinite(share)||share<0||share>100){$('message').textContent=copy[lang].invalid;return}phase=1;event('requested');$('message').textContent='';render()};$('amend').onclick=()=>{archives.push(structuredClone({version,data,share,signed}));version++;phase=0;signed=[null,null];event('amended');render()};$('progress').onchange=e=>{stage=+e.target.value};reset();
</script></html>
